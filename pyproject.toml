[project]
name = "sih26054-digital-twin"
version = "0.1.0"
description = "Digital Twin for MALE UAV Aero-Piston Engines — physics-anchored, uncertainty-aware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "filterpy>=1.4.5",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
train = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
